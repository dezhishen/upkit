name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: 显示 Go 版本
        run: go version

      - name: gofmt 检查
        run: |
          # 注意不能写成 unformatted="$(gofmt -l .)"：语法错误时 gofmt 返回非 0，
          # 但退出码会被命令替换吞掉，检查反而“通过”。
          if ! unformatted="$(gofmt -l .)"; then
            echo "gofmt 解析失败（通常是语法错误，比如重复的 package 行）"
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: 文件头检查
        run: bash scripts/check-headers.sh

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        # -count=1 关掉结果缓存：命中缓存时测试根本没跑，却会报绿。
        # -timeout 防止某个用例卡死把 job 拖到 GitHub 的 6 小时上限才失败。
        run: go test -race -count=1 -timeout 15m -covermode=atomic -coverprofile=coverage.out ./...

      - name: 覆盖率摘要
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### 各包覆盖率" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go test -count=1 -cover ./... 2>/dev/null | grep -v "no test files" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 关键包覆盖率门禁
        # 阈值取在实测值下方 5–10 个点：既能拦住“新代码没写测试”，
        # 又不会因为无关紧要的一两行变动就把人卡在 CI 上。
        run: |
          set -u
          fail=0
          check() {
            pkg="$1"; min="$2"
            cov=$(go test -count=1 -cover "$pkg" 2>/dev/null | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')
            if [ -z "$cov" ]; then
              echo "::error file=$pkg::拿不到覆盖率（包不存在或测试无法运行）"
              fail=1
              return
            fi
            printf '%-28s %6s%%（下限 %s%%）\n' "$pkg" "$cov" "$min"
            if ! awk -v c="$cov" -v m="$min" 'BEGIN{exit !(c+0 >= m+0)}'; then
              echo "::error file=$pkg::覆盖率 $cov% 低于下限 $min%"
              fail=1
            fi
          }

          check ./internal/util        80
          check ./internal/registry    90
          check ./internal/download    75
          check ./internal/archive     70
          check ./internal/unpacking   70
          check ./internal/version     75
          check ./internal/pluginfeed  65
          check ./internal/apps        65
          check ./internal/fsutil      60
          check ./internal/settings    55
          check ./internal/github      55
          check ./internal/logging     55
          check ./internal/engine      30

          exit $fail

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  build:
    name: 构建可下载产物
    runs-on: ubuntu-latest
    needs: test
    # 这里产出的是「能直接下载来手动试」的 exe。
    #
    # 它以前只做交叉编译校验（-o /dev/null），产物随手丢掉 —— 于是 CI 里
    # 唯一能下载 exe 的地方只剩 smoke 的 release-smoke artifact，
    # 名字也不直观，找起来很费劲。现在两个 job 的职责是：
    #   build —— 日常可下载的构建产物（每次 push 都有，保留 7 天）
    #   smoke —— 完整发布演练（与真发版同一条链路）
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: 编译 windows/${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 带上版本信息，方便拿到 exe 的人确认是哪个提交构建的。
          version="v0.0.0-dev.${GITHUB_SHA::7}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA::7}" \
            -o "dist/upkit-${{ matrix.goos }}-${{ matrix.goarch }}.exe" ./cmd/upkit
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: upkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.exe
          retention-days: 7

  smoke:
    name: 发布演练（不推 release）
    needs: test
    # 与真发版共用同一份构建定义（.github/workflows/build-release.yml），
    # 所以「main 上是绿的」就意味着「现在能发版」—— 交叉编译、订阅地址注入
    # 这些环节都在这里提前验过，不会拖到发版那一刻才发现。
    #
    # 产物传到 artifact 供下载核对；本工作流不碰 tag、不碰 Release。
    uses: ./.github/workflows/build-release.yml
    with:
      # 演练版本：合法 semver，且一眼能看出不是真版本。
      version: v0.0.0-dev.${{ github.sha }}
      artifact-name: release-smoke

  publish-smoke:
    name: 发布演练（不创建 Release）
    needs: smoke
    # 发布这一步同样与真发版共用一份定义（publish-release.yml）。
    #
    # 之前这条演练只覆盖了构建那一半，于是 publish job 少一步 checkout 的问题
    # 一直到真正打 tag 才暴露（v0.0.1 就这么挂的：gh 报 not a git repository）。
    # 发布这一步出的事故多半与环境无关，跑一遍就能撞出来。
    uses: ./.github/workflows/publish-release.yml
    with:
      version: v0.0.0-dev.${{ github.sha }}
      artifact-name: release-smoke
      dry-run: "true"
