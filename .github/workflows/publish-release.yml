name: Publish Release

# 可复用工作流：把构建产物挂到 GitHub Release 上。
#
# 与 build-release.yml 同样的用意 —— 演练与真发版共用一份定义。此前发布逻辑
# 只写在 release.yml 里，CI 的「发布演练」只跑了构建那一半，于是 publish 少一步
# checkout 这种问题要等到真正打 tag 才暴露（v0.0.1 就这么挂的）：
#
#   failed to run git: fatal: not a git repository
#
# 发布这一步出的事故多数与环境无关 —— 缺 checkout、产物路径写错、gh 参数拼错
# —— 演练时跑一遍就能撞出来。
#
# 本工作流**只发 Release**：不打 tag、不构建。产物由调用方构建好并上传为
# artifact，这里只负责取下来、校验齐全、发布。
#
# 权限由调用方授予：真发版需要 contents: write（release.yml 已在顶层声明），
# 演练只需要读（ci.yml 只给 contents: read）。这里不写 permissions 块，
# 以免与调用方的授权范围打架。

on:
  workflow_call:
    inputs:
      version:
        description: 版本号（形如 v1.2.3 或 v1.3.0-rc.1）
        required: true
        type: string
      prerelease:
        description: 是否标记为预览版（"true" / "false"）
        required: false
        type: string
        default: "false"
      start-tag:
        description: changelog 起点；留空表示这是首个正式版
        required: false
        type: string
        default: ""
      artifact-name:
        description: 从哪个 artifact 取产物
        required: false
        type: string
        default: release-dist
      dry-run:
        description: 只演练：校验前置条件与产物齐全，不创建 Release（"true" / "false"）
        required: false
        type: string
        default: "false"

jobs:
  publish:
    name: 创建 Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      START_TAG: ${{ inputs.start-tag }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      # 顺序不能反：actions/checkout 默认会 git clean -ffdx，把工作区里未被 git
      # 跟踪的文件清掉 —— 先下载的产物会被一并删除。
      #
      # fetch-depth 0 与 --generate-notes 相关：gh 需要本地仓库里的历史与 tag
      # 才能算出 changelog 的范围。缺这一步（或只取浅历史）会以
      # "fatal: not a git repository" 失败。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: 发布
        run: |
          set -euo pipefail

          # job 日志需要仓库管理员权限才能读，而 ::notice:: / ::error:: 注解是公开的。
          # 所以关键状态与命令输出都往注解上抛一份，出问题时不必登录就能定位 ——
          # v0.0.1 排查时因为没有这条通道，连着两次只能靠猜。
          emit() { printf '%s' "$1" | head -c 2000; }
          gh_run() {
            local out
            if ! out="$("$@" 2>&1)"; then
              echo "::error::命令失败: $*"
              echo "::error::输出: $(emit "$out")"
              return 1
            fi
            echo "::notice::$* → $(emit "$out")"
          }

          echo "::notice::VERSION=[${VERSION}] PRERELEASE=[${PRERELEASE}] START_TAG=[${START_TAG:-}] DRY_RUN=[${DRY_RUN}]"

          # 前置条件单独报错，比 gh 自己抛 "not a git repository" 好定位。
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "::error::工作目录不是 git 仓库，gh --generate-notes 无法解析 changelog 范围；本 job 缺少 actions/checkout"
            exit 1
          fi

          # upkit 本体与校验值。插件制品与 feed.yaml 都由 upkit-hub 托管，
          # 不在本仓库发布 —— 本仓库只做平台。
          files=(
            dist/upkit-windows-amd64.exe
            dist/upkit-windows-arm64.exe
            dist/sha256sums.txt
          )
          echo "::notice::将发布 ${#files[@]} 个文件，git 仓库=$PWD"

          # 逐个确认存在，缺失时给出比 gh 更明确的报错。
          missing=0
          for f in "${files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::缺少产物 $f"
              missing=1
            fi
          done
          (( missing == 0 )) || exit 1

          # 反向检查：sha256sums.txt 列出的每一项都必须在本 job 的发布清单里。
          # 否则用户拿到的是一份指向不存在文件的校验清单 —— v0.0.1 就出过这个：
          # build.sh 打了 zip 包，artifact 只 glob *.exe，于是清单里多出两行。
          while read -r _sum name; do
            [[ -n "$name" ]] || continue
            if ! printf '%s\n' "${files[@]}" | grep -qxF "dist/${name}"; then
              echo "::error::sha256sums.txt 列出了 dist/${name}，但它不在本次发布的文件里"
              exit 1
            fi
          done <dist/sha256sums.txt

          notes_args=(--generate-notes)
          [[ -n "$START_TAG" ]] && notes_args+=(--notes-start-tag "$START_TAG")

          if [[ "$DRY_RUN" == "true" ]]; then
            {
              echo "### 发布演练 $VERSION"
              echo
              echo "前置条件与产物校验通过，未创建 Release。"
              echo
              echo '```'
              echo "预览版: $PRERELEASE"
              echo "changelog 起点: ${START_TAG:-（无，首个正式版）}"
              echo "待上传 ${#files[@]} 个文件："
              printf '  %s\n' "${files[@]}"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "演练通过：$VERSION，${#files[@]} 个产物齐全"
            exit 0
          fi

          # 探测用 --json 拿 isDraft，而不是解析 gh release view 的文本输出 ——
          # 这里真正要区分的是「已发布的」和「草稿」，因为草稿对外完全不可见：
          # Releases 页面没有它，REST 按 tag 查不到它，附件下载链接也不存在。
          # 只看得到「存在」就会掉进下面的更新分支，把附件反复传进一个永远不公开的
          # 草稿里，而每一次都报成功。v0.0.1 卡在这里就是因为它是个草稿，且草稿不绑定
          # tag，所以删了三次 tag 都没带走它；流水线每次判成「重跑」，后置检查又查不到
          # 草稿于是报"gh 报了成功但实际没发布"——其实 create 早就不再执行了。
          #
          # 探测失败仍是预期内的（首次发版时确实不存在），但原因要看一眼：
          # 鉴权问题会伪装成「release 不存在」。
          view_ok=0
          view_out="$(gh release view "$VERSION" --json isDraft,url \
            --jq '"draft=\(.isDraft) url=\(.url)"' 2>&1)" || view_ok=$?
          echo "::notice::探测 ${VERSION}: 退出码=$view_ok 输出=$(emit "${view_out}")"

          if (( view_ok == 0 )); then
            # 重跑：附件覆盖，不影响已存在的 tag。
            echo "Release $VERSION 已存在，更新附件"
            gh_run gh release upload "$VERSION" "${files[@]}" --clobber

            # changelog 重新生成。注意 gh release edit **不认 --generate-notes**
            # （那是 create 的旗标），得自己调 API 生成再写回去。
            #
            # 刷新 changelog 属于润色，失败不该让刚上传好的附件白费，因此只告警。
            notes_file="$(mktemp)"
            api_args=(-f "tag_name=${VERSION}")
            [[ -n "$START_TAG" ]] && api_args+=(-f "previous_tag_name=${START_TAG}")
            if gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                 "${api_args[@]}" --jq .body >"$notes_file" &&
               gh release edit "$VERSION" --notes-file "$notes_file"; then
              echo "changelog 已刷新"
            else
              echo "::warning::changelog 未能重新生成，保留原有 notes"
            fi
            rm -f "$notes_file"
          else
            create_args=("$VERSION" --title "$VERSION" --verify-tag "${notes_args[@]}")
            [[ "$PRERELEASE" == "true" ]] && create_args+=(--prerelease)
            echo "::notice::走创建分支: gh release create ${create_args[*]}"
            gh_run gh release create "${create_args[@]}" "${files[@]}"
          fi

          # 显式发布一次。草稿可能来自上一次跑残留下来的，也可能有人在网页上存了草稿
          # 再打 tag —— 两种情况上面都只会走更新分支，草稿状态一直没人动，于是发版
          # 永远"成功"而外面永远看不到。--draft=false 对已发布的 release 是幂等的，
          # 所以无条件执行，不留分支。
          gh_run gh release edit "$VERSION" --draft=false
          [[ "$PRERELEASE" == "true" ]] && gh_run gh release edit "$VERSION" --prerelease

          # 事后复核。gh 有可能什么都没做成却退出 0（权限不足、仓库功能受限等），
          # 那样这盏绿灯是假的 —— v0.0.1 就这么"成功"过好几次，实际 Releases 页面上
          # 一个都没有。所以用 API 确认一次，把这种情况变成明确的失败。
          #
          # 特意查 REST 而不是 gh release view：前者看不见草稿，正好是要的口径 ——
          # 「发版成功」的标准是外面的人能看见，不是 gh 自己看得见。
          check_ok=0
          check_out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" \
            --jq '"draft=\(.draft) assets=\(.assets | length)"' 2>&1)" || check_ok=$?
          if (( check_ok != 0 )); then
            echo "::error::${VERSION} 的 Release 对外不可见；gh 报了成功但实际没发布"
            echo "::error::复核输出: $(emit "${check_out}")"
            echo "  检查仓库是否启用了 Releases，以及 job 是否有 contents: write" >&2
            exit 1
          fi
          if [[ "$check_out" != "draft=false assets=${#files[@]}" ]]; then
            echo "::error::${VERSION} 的 Release 状态不对: 期望 draft=false assets=${#files[@]}，实际 ${check_out}"
            echo "  仍是草稿时对外不可见；附件数不符时多半是历史遗留的陈旧附件，去 Releases 页面删掉多余的那个再重跑" >&2
            exit 1
          fi
          echo "::notice::复核通过: ${check_out}"

          {
            echo "### 已发布 $VERSION"
            echo
            echo "预览版: $PRERELEASE"
            echo
            echo '```'
            echo "产物: upkit-windows-amd64.exe / upkit-windows-arm64.exe / sha256sums.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
