name: Release

# 两条入口：
#
#   1. 手动触发（日常发版走这条）：选版本位与阶段，工作流自己算版本、打 tag、发版。
#      用默认 GITHUB_TOKEN 打的 tag 不会再触发本工作流，因此不会重复运行。
#   2. 推送 v* tag（手工打 tag，或需要重跑一次发布时）。
#
# changelog 由 GitHub 依据 PR 与 commit 自动生成，分类规则见 .github/release.yml。
# 发布手册（版本策略、发版步骤、出错了怎么办）见 docs/release.md。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本位
        type: choice
        options: [patch, minor, major, hotfix]
        default: patch
      stage:
        description: 阶段（stable=正式版，rc/beta=预览版）
        type: choice
        options: [stable, rc, beta]
        default: stable
      dry_run:
        description: 只演练：构建并生成清单，但不打 tag、不发版
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 发布不能基于坏代码：CI 虽然在 main 上跑过，但 tag 可能打在别处。
  verify:
    name: 发布前门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: gofmt 检查
        run: |
          # 语法错误时 gofmt 返回非 0；用 if ! 接住，别让退出码被命令替换吞掉。
          if ! unformatted="$(gofmt -l .)"; then
            echo "gofmt 解析失败（通常是语法错误，比如重复的 package 行）"
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："; echo "$unformatted"; exit 1
          fi

      - name: 文件头检查
        run: bash scripts/check-headers.sh

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

  # 算出这次要发的版本号，并在需要时把 tag 打上。
  version:
    name: 计算版本
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      start_tag: ${{ steps.v.outputs.start_tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      # 需要完整历史与所有 tag 才能算版本、找上一个正式版。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: v
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          STAGE: ${{ inputs.stage }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$(bash scripts/next-version.sh "${BUMP:-patch}" "${STAGE:-stable}")"
          else
            version="$REF_NAME"
          fi
          echo "版本号: $version"

          # 预览版：tag 带 -rc.N / -beta.N 这类后缀。
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          # changelog 的起点取「最近一个正式版」：预览版据此列出自上个正式版以来的
          # 全部变更；正式版则给出相对上个正式版的完整变化，而不是只有 rc 之后新增的
          # 那几条。
          start_tag="$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${version}$" \
            | sort -V | tail -n 1 || true)"
          echo "changelog 起点: ${start_tag:-（无，这是首个版本）}"

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "start_tag=$start_tag"
            echo "dry_run=${DRY_RUN:-false}"
          } >>"$GITHUB_OUTPUT"

      - name: 打 tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != true }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} 已存在，无法重复发布（换个版本位，或先删掉它）"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "发布 ${VERSION}"
          git push origin "${VERSION}"

  build:
    name: 构建发布产物
    needs: version
    # 与 main 上的发布演练共用同一份定义：演练绿的，这里就不会有意外。
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-name: release-dist

  publish:
    name: 创建 Release
    needs: [version, build]
    if: ${{ needs.version.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      START_TAG: ${{ needs.version.outputs.start_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: 发布
        run: |
          set -euo pipefail

          # 产物一次性上传：upkit 本体、校验值、示例插件、官方订阅清单。
          # feed.yaml 作为附件发布 —— 内置订阅地址指向 .../releases/latest/download/feed.yaml。
          files=(
            dist/upkit-windows-amd64.exe
            dist/upkit-windows-arm64.exe
            dist/sha256sums.txt
            dist/feed.yaml
          )
          for f in dist/plugins/*.exe; do files+=("$f"); done

          notes_args=(--generate-notes)
          [[ -n "$START_TAG" ]] && notes_args+=(--notes-start-tag "$START_TAG")

          if gh release view "$VERSION" >/dev/null 2>&1; then
            # 重跑：附件覆盖、notes 重新生成，不影响已存在的 tag。
            echo "Release $VERSION 已存在，更新附件与 changelog"
            gh release upload "$VERSION" "${files[@]}" --clobber
            gh release edit "$VERSION" "${notes_args[@]}"
          else
            create_args=("$VERSION" --title "$VERSION" --verify-tag "${notes_args[@]}")
            [[ "$PRERELEASE" == "true" ]] && create_args+=(--prerelease)
            gh release create "${create_args[@]}" "${files[@]}"
          fi

          {
            echo "### 已发布 $VERSION"
            echo
            echo "预览版: $PRERELEASE"
            echo
            echo '```'
            echo "产物: upkit-windows-amd64.exe / upkit-windows-arm64.exe / feed.yaml / 插件"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
