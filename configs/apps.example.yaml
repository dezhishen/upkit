# upkit 软件清单示例
#
# 软件的来源用「订阅」：在 upkit 的「来源」面板按 a 填地址。
# 官方源里没有、要自己维护时才写这份清单。
#
# 用法：复制到 <设置目录>/apps.yaml 后按需修改。
#
# 每个软件由四条轴组合而成，都可以按需替换（开闭原则）：
#   source  从哪拿：github-release
#   unpack  产物如何变成文件树：zip | tar.gz | raw
#   method  如何装到本机：portable-inplace | exe-installer | msiexec
#   detect  本机是哪个版本：state-file | pe-resource | dir-name | cli-version
#
# 省略的字段按 method 推断默认值：
#   portable-inplace → unpack=zip，detect=[state-file pe-resource dir-name]
#   其它 method      → unpack=raw，detect=[state-file cli-version]

version: 2

conflicts:
  # 三档一律 block（被遮蔽的条目会在界面上置灰并说明原因）
  same_id: block
  same_target: block
  fuzzy: block

apps:
  # ── 例 1：绿色版（解压即用，原地替换）────────────────────────
  - id: chromium
    name: Ungoogled Chromium
    enabled: true
    source:
      kind: github-release
      repo: ungoogled-software/ungoogled-chromium-windows
      # 产物筛选：{arch} 会按 arch 替换为 x64 / arm64 / ...
      asset: "*{arch}*.zip"
      arch: x64
      # 只发布 preview 时才需要打开
      prerelease: false
    unpack:
      kind: zip
      # 解压后目录里包含该文件的那一层即为安装源根目录
      find_root: chrome.exe
    method:
      kind: portable-inplace
    install:
      path: "%LOCALAPPDATA%/Chromium"
      entrypoints: ["chrome.exe"]
      # 替换时保留的相对路径/通配符（用户数据、日志等）
      preserve: ["User Data", "*.log"]
      # 检测占用安装目录的进程名（留空时自动扫描目录下的 exe）
      processes: ["chrome.exe"]
    update:
      # 上游偶尔重发同一版本号时，按修订号判断是否需要更新
      track_revision: true
    tags: ["browser"]

  # ── 例 2：官方安装器（exe，静默安装）──────────────────────────
  - id: vscode
    name: Visual Studio Code
    enabled: false
    source:
      kind: github-release
      repo: microsoft/vscode
      asset: "*Setup-x64-*.exe"
    method:
      kind: exe-installer
      # 传给安装器的静默参数（按空格切分，支持 {artifact}/{version} 等变量）
      args: ["/VERYSILENT", "/NORESTART", "/MERGETASKS=!runcode"]
      # 安装器超时（秒）；安装器退出码 0 不算成功，upkit 会再复核下面的入口文件
      timeout_seconds: 900
    detect:
      - state-file
      - pe-resource
    install:
      path: "%LOCALAPPDATA%/Programs/Microsoft VS Code"
      entrypoints: ["Code.exe"]
    # enabled: false —— 示例默认停用，确认路径无误后再打开

  # ── 例 3：命令行工具（读取自身版本号探测）────────────────────
  - id: fzf
    name: fzf
    enabled: false
    source:
      kind: github-release
      repo: junegunn/fzf
      asset: "fzf-*windows_amd64.zip"
    unpack:
      kind: zip
      find_root: fzf.exe
    method:
      kind: portable-inplace
      # cli-version 探测要执行的命令（相对于安装目录）
      version_cmd: "fzf.exe --version"
    detect:
      - state-file
      - cli-version
    install:
      path: "%LOCALAPPDATA%/fzf"
      entrypoints: ["fzf.exe"]
    update:
      track_revision: false

# 用户手工声明「这些其实是同一个软件」时，可以在此列出等价组，
# upkit 会按组内第一条保留、其余遮蔽：
# equivalents:
#   - canonical: chromium
#     members: ["chromium", "chromium-beta"]
#     policy: block
#
# 如果确认某两条不是同一个软件，可把它们的 id 组合写进 not_equivalent 以解除提示：
# not_equivalent:
#   - ["chromium", "chromium-beta"]

# ── 插件来源（可选）─────────────────────────────────────────────
#
# 插件是可选的「进程外软件源」：一个插件提供一组软件（含版本与下载地址），
# 下载 / 解包 / 落地 / 探测仍然复用上面四条内置轴（catalog 模式）。
# 一个插件 = 一个可执行文件 = 一个来源 = 多个软件。
#
# 安装插件：把可执行文件与描述文件放进 <根目录>/plugin/
#   plugin/example-static[.exe]
#   plugin/example-static.plugin.yaml    # id / name / mode / exec / timeout_seconds
#
# 安全：插件等于任意代码执行，**没有写入 trust 的插件不会被启动**。
# 首次运行会把它的 sha256 写进日志（「插件来源未启用 ... sha256=...」），
# 确认来源可信后把该哈希填到下面即可启用；文件被替换后哈希变化，需要重新信任。
#
# sources:
#   - id: example-static
#     kind: plugin            # 目前只支持 plugin（内置来源不需要声明）
#     enabled: true
#     mode: catalog           # catalog（只提供来源）| full（自己接管安装）
#     exec: example-static    # 相对插件目录；留空按 <id>[.exe] 查找
#     trust: "在此填入 sha256"
#     timeout_seconds: 20
#     config:                 # 插件级配置（对应插件声明的 ConfigSchema）
#       download_base: https://mirror.example.com/vpn
#     apps:                   # 源内软件级开关；未列出的沿用插件默认（启用）
#       - id: corp-vpn
#         enabled: true
#       - id: legacy-crm
#         enabled: false
#
# 插件里的软件以「限定 ID」出现，形如 <来源ID>/<软件ID>（如 example-static/corp-vpn）。
# 如果上面的 apps: 里写了同 ID 的条目，则以你的写法为准（可覆盖插件给的默认值）。
