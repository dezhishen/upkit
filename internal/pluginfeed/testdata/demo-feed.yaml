# upkit 订阅示例
#
# 这是一个可以直接照抄的模板：多插件、多架构、相对路径引用产物。
# 它同时是 internal/pluginfeed 的测试夹具（见 demo_test.go）—— 也就是说这份示例
# 写错了测试会直接失败。改动它之后请跑：go test ./internal/pluginfeed/
#
# 约定速览：
#   · 平台键是 GOOS/GOARCH，upkit 只支持 windows/amd64 与 windows/arm64
#   · sha256 是**强制**字段：宿主会拒绝没有摘要、或摘要不符的包
#   · url 写相对路径时按订阅地址解析，并且强制同源；
#     写绝对地址且跨域时，必须由用户在界面上单独授权该域名
#   · mode 省略即 catalog（宿主内置四轴安装）；写 full 表示插件自己接管安装
#   · min_host_version 用来挡住过旧的宿主，避免启动后才发现协议不兼容
#   · 格式既可以是 .yaml/.yml 也可以是 .json（同一套结构）
#   · 如果同一个订阅还要服务别的工具，可以放其它平台的包 —— upkit 会忽略它们，
#     只挑自己平台的那一份

